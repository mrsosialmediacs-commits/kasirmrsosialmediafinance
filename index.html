/* ============================================================
   KONEKSI KE WEB ADMIN (worker.js Cloudflare)
   Endpoint /api/catalog/list itu PUBLIK (gak butuh token), jadi
   aman dipanggil langsung dari sini buat nampilin produk yang
   ditambahkan Admin secara real-time.
============================================================ */
const API_BASE = 'https://wispy-dust-a163.mrsosialmediacs.workers.dev';
const CATALOG = {
  products: [],      // hasil fetch dari /api/catalog/list
  loaded: false,      // sudah pernah berhasil fetch minimal 1x
  syncing: false,
  error: null,
  lastSync: null,
};
let ADMIN_BANNERS = []; // hasil fetch dari /api/banners/list (maks 5, sudah diurutkan server)

async function syncCatalog(){
  CATALOG.syncing = true;
  const btn = document.getElementById('sync-btn');
  if(btn) btn.classList.add('animate-spin');
  try{
    const [catRes, banRes] = await Promise.all([
      fetch(`${API_BASE}/api/catalog/list`),
      fetch(`${API_BASE}/api/banners/list`),
    ]);
    const catJson = await catRes.json();
    const banJson = await banRes.json();
    if(catJson && catJson.success){
      CATALOG.products = catJson.products || [];
      CATALOG.loaded = true;
      CATALOG.error = null;
      CATALOG.lastSync = new Date();
    } else {
      CATALOG.error = (catJson && catJson.error) || 'Gagal memuat katalog';
    }
    if(banJson && banJson.success){
      ADMIN_BANNERS = banJson.banners || [];
    }
  } catch(err){
    // Kemungkinan besar CORS (origin halaman ini belum ada di ALLOWED_ORIGINS worker.js)
    // atau memang belum ada koneksi internet. App tetap jalan pakai data contoh (demo).
    CATALOG.error = 'Tidak bisa terhubung ke Web Admin (' + (err.message || 'network error') + ')';
    console.warn('[syncCatalog]', err);
  }
  CATALOG.syncing = false;
  if(btn) btn.classList.remove('animate-spin');
  render(true);
}

function adminProductsFor(category){
  return CATALOG.products
    .filter(p => (p.category || '').trim().toLowerCase() === category.trim().toLowerCase())
    .map(p => ({
      label: p.name,
      price: (p.discountPrice != null && p.discountPrice > 0) ? p.discountPrice : p.sellPrice,
      originalPrice: (p.discountPrice != null && p.discountPrice > 0) ? p.sellPrice : null,
      sku: p.digiflazzSku,
      source: 'admin',
    }));
}

const OPERATOR_PREFIX = {
  Telkomsel: ['0811','0812','0813','0821','0822','0823','0851','0852','0853'],
  Indosat: ['0814','0815','0816','0855','0856','0857','0858'],
  XL: ['0817','0818','0819','0859','0877','0878'],
  Axis: ['0831','0832','0833','0838'],
  Three: ['0895','0896','0897','0898','0899'],
};
function detectOperator(phone){
  const p4 = phone.slice(0,4);
  for(const op in OPERATOR_PREFIX){ if(OPERATOR_PREFIX[op].includes(p4)) return op; }
  return null;
}

function showToast(msg, type='success'){
  const root = document.getElementById('toast-root');
  const color = type==='success' ? 'bg-emerald-600' : 'bg-rose-600';
  const el = document.createElement('div');
  el.className = `toast-anim ${color} text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg pointer-events-auto max-w-[85%] text-center`;
  el.textContent = msg;
  root.innerHTML = '';
  root.appendChild(el);
  setTimeout(()=>{ if(root.contains(el)) root.removeChild(el); }, 2500);
}

/* ============================================================
   BANNER CAROUSEL: dots pagination, klik buat pindah, auto-loop
============================================================ */
let bannerTimer = null;

function onBannerScroll(el){
  const slides = el.querySelectorAll('.banner-slide');
  if(slides.length === 0) return;
  const viewportCenter = el.scrollLeft + el.clientWidth / 2;
  let closest = 0, closestDist = Infinity;
  slides.forEach((s, i) => {
    const slideCenter = s.offsetLeft + s.offsetWidth / 2;
    const dist = Math.abs(slideCenter - viewportCenter);
    if(dist < closestDist){ closestDist = dist; closest = i; }
  });
  if(closest !== STATE.bannerIndex){
    STATE.bannerIndex = closest;
    updateBannerDots();
  }
}

function updateBannerDots(){
  const dotsEl = document.getElementById('banner-dots');
  if(!dotsEl) return;
  Array.from(dotsEl.children).forEach((dot, i) => {
    dot.className = i === STATE.bannerIndex
      ? 'rounded-full transition-all w-2.5 h-2.5 bg-brand'
      : 'rounded-full transition-all w-1.5 h-1.5 bg-gray-300';
  });
}

function goToBanner(idx, smooth){
  const scrollEl = document.getElementById('banner-scroll');
  if(!scrollEl) return;
  const slides = scrollEl.querySelectorAll('.banner-slide');
  if(!slides[idx]) return;
  const slide = slides[idx];
  const target = slide.offsetLeft - (scrollEl.clientWidth - slide.offsetWidth) / 2;
  scrollEl.scrollTo({ left: target, behavior: smooth === false ? 'auto' : 'smooth' });
  STATE.bannerIndex = idx;
  updateBannerDots();
}

// Auto-geser tiap 4.5 detik; begitu udah di slide terakhir, otomatis balik ke slide pertama (loop).
function startBannerAutoplay(){
  if(bannerTimer) clearInterval(bannerTimer);
  const scrollEl = document.getElementById('banner-scroll');
  if(!scrollEl) return;
  const slides = scrollEl.querySelectorAll('.banner-slide');
  if(slides.length <= 1) return;
  bannerTimer = setInterval(() => {
    const curSlides = scrollEl.querySelectorAll('.banner-slide');
    if(curSlides.length === 0) return;
    const next = (STATE.bannerIndex + 1) >= curSlides.length ? 0 : STATE.bannerIndex + 1;
    goToBanner(next);
  }, 4500);
}

/* ============================================================
   ACTION HANDLER (event delegation)
============================================================ */
document.addEventListener('click', (e) => {
  // close modal on backdrop click
  const closeEl = e.target.closest('[data-close-modal]');
  if(closeEl){ closeModal(); return; }

  const navEl = e.target.closest('[data-nav]');
  if(navEl){
    const page = navEl.dataset.nav;
    let param = null;
    try { param = navEl.dataset.param ? JSON.parse(navEl.dataset.param) : null; } catch(e){ param = navEl.dataset.param; }
    navigate(page, param);
    return;
  }

  const quickAmt = e.target.closest('.quick-amt');
  if(quickAmt){
    const input = document.getElementById('topup-input');
    if(input){
      input.value = Number(quickAmt.dataset.amount).toLocaleString('id-ID');
    }
    return;
  }

  const actEl = e.target.closest('[data-action]');
  if(!actEl) return;
  const action = actEl.dataset.action;

  if(action === 'banner-goto'){ goToBanner(Number(actEl.dataset.idx)); return; }

  if(action === 'sync-catalog'){ syncCatalog(); return; }

  if(action === 'kyc-guard'){
    if(STATE.kycVerified){ showToast('Fitur ini akan segera hadir'); return; }
    showKYCModal(actEl.dataset.context);
    return;
  }
  if(action === 'kyc-verify'){
    STATE.kycVerified = true;
    closeModal();
    showToast('Akun berhasil diverifikasi!');
    render(true);
    return;
  }

  if(action === 'topup-continue'){
    const raw = document.getElementById('topup-input').value.replace(/\D/g,'');
    const amt = Number(raw||0);
    if(amt < 1000){ showToast('Masukkan nominal topup yang valid', 'error'); return; }
    STATE.saldo += amt;
    STATE.history.unshift({id:'TRX'+Math.floor(Math.random()*90000+10000), title:'Isi Saldo', target:'Dompet Saya', date:new Date().toISOString().slice(0,10), time:'now', status:'Berhasil', amount:amt});
    showToast(`Topup ${money(amt)} berhasil (simulasi, belum tersambung payment gateway)`);
    navigate('home');
    return;
  }

  if(action === 'pulsa-tab'){ STATE.params.tab = actEl.dataset.tab; render(true); return; }
  if(action === 'pln-tab'){ STATE.params.tab = actEl.dataset.tab; render(true); return; }
  if(action === 'ewallet-open'){
    closeModal();
    const kind = actEl.dataset.context || 'ewallet';
    const providers = kind === 'ojol' ? OJOL_PROVIDERS : EWALLET_PROVIDERS;
    document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 z-40 flex items-end justify-center" data-modal-backdrop>
      <div class="absolute inset-0 bg-black/40" data-close-modal></div>
      <div class="relative w-full max-w-md bg-white rounded-t-3xl p-5 sheet-anim">
        <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
        <h3 class="font-bold text-gray-800 mb-4">${kind==='ojol' ? 'Pilih Provider Ojol' : 'Pilih Provider E-Wallet'}</h3>
        <div class="grid grid-cols-3 gap-2.5">
          ${providers.map(p => `
            <button class="border border-gray-200 rounded-xl py-4 px-1.5 text-center hover:border-brand" data-action="ewallet-open-select" data-kind="${kind}" data-provider="${p}">
              <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-1.5 text-[10px] font-bold text-gray-500">${p.slice(0,2).toUpperCase()}</div>
              <span class="text-[11px] font-semibold text-gray-700">${p}</span>
            </button>`).join('')}
        </div>
      </div>
    </div>`;
    return;
  }
  if(action === 'ewallet-open-select'){
    const kind = actEl.dataset.kind;
    const provider = actEl.dataset.provider;
    closeModal();
    navigate('ewallet', kind);
    STATE.params.provider = provider;
    render(true);
    return;
  }
  if(action === 'game-select'){ STATE.params.game = actEl.dataset.game; STATE.params.userId=''; STATE.params.zoneId=''; render(true); return; }

  if(action === 'game-add-custom'){
    const name = prompt('Nama game / produk baru:');
    if(!name) return;
    const nomStr = prompt('Nominal harga, pisahkan koma (contoh: 10000,25000,50000):', '10000,25000,50000');
    if(!nomStr) return;
    const nominal = nomStr.split(',').map(s => Number(s.trim())).filter(n => n > 0).map(n => ({ l:'Top Up '+money(n), p:n }));
    if(nominal.length === 0){ showToast('Nominal tidak valid', 'error'); return; }
    STATE.customGames.push({ name, nominal });
    STATE.params.game = name;
    showToast(`${name} ditambahkan ke daftar game`);
    render(true);
    return;
  }

  if(action === 'cek-tagihan'){
    const idpel = STATE.params.idpel;
    if(!idpel){ showToast('Masukkan ID Pelanggan terlebih dahulu', 'error'); return; }
    document.getElementById('tagihan-result').innerHTML = `
      <div class="bg-white border border-gray-200 rounded-xl p-4 mb-4">
        <div class="flex justify-between text-sm mb-2"><span class="text-gray-400">ID Pelanggan</span><span class="font-semibold text-gray-700">${idpel}</span></div>
        <div class="flex justify-between text-sm mb-2"><span class="text-gray-400">Nama Pelanggan</span><span class="font-semibold text-gray-700">BUDI SANTOSO</span></div>
        <div class="flex justify-between text-sm mb-2"><span class="text-gray-400">Periode</span><span class="font-semibold text-gray-700">Agustus 2026</span></div>
        <div class="flex justify-between text-sm"><span class="text-gray-400">Total Tagihan</span><span class="font-bold text-brand-dark">Rp 245.000</span></div>
      </div>
      <button class="w-full bg-brand text-white font-semibold py-3.5 rounded-xl" data-action="buy" data-title="Tagihan Listrik ${idpel}" data-price="245000" data-target="${idpel}">Bayar Sekarang</button>
    `;
    return;
  }

  if(action === 'buy-generic'){
    const idEl = document.getElementById('generic-id');
    const target = idEl && idEl.value ? idEl.value : null;
    if(!target){ showToast('Masukkan ID Pelanggan / Nomor Registrasi dahulu', 'error'); return; }
    const title = actEl.dataset.title;
    const price = Number(actEl.dataset.price);
    if(STATE.saldo < price){ showToast('Saldo tidak mencukupi, silakan isi saldo dahulu', 'error'); return; }
    STATE.saldo -= price;
    STATE.history.unshift({id:'TRX'+Math.floor(Math.random()*90000+10000), title, target, date:new Date().toISOString().slice(0,10), time:'now', status:'Berhasil', amount:price});
    showToast(`${title} berhasil dibeli!`);
    navigate('home');
    return;
  }

  if(action === 'buy' || action === 'buy-dynamic-target'){
    const title = actEl.dataset.title;
    const price = Number(actEl.dataset.price);
    const target = actEl.dataset.target || STATE.params.phone || STATE.params.userId || STATE.params.idpel || '-';
    if(STATE.saldo < price){
      showToast('Saldo tidak mencukupi, silakan isi saldo dahulu', 'error');
      return;
    }
    STATE.saldo -= price;
    STATE.history.unshift({id:'TRX'+Math.floor(Math.random()*90000+10000), title, target, date:new Date().toISOString().slice(0,10), time:'now', status:'Berhasil', amount:price});
    showToast(`${title} berhasil dibeli!`);
    navigate('home');
    return;
  }

  if(action === 'cart-add'){
    const idx = Number(actEl.dataset.idx);
    const item = KATALOG[idx];
    const existing = STATE.kasirCart.find(c=>c.name===item.name);
    if(existing) existing.qty++; else STATE.kasirCart.push({...item, qty:1});
    showToast(`${item.name} ditambahkan`);
    return;
  }
  if(action === 'cart-open'){ document.getElementById('modal-root').innerHTML = pageCartSheet(); return; }
  if(action === 'cart-inc'){ STATE.kasirCart[actEl.dataset.idx].qty++; document.getElementById('modal-root').innerHTML = pageCartSheet(); return; }
  if(action === 'cart-dec'){
    const i = Number(actEl.dataset.idx);
    STATE.kasirCart[i].qty--;
    if(STATE.kasirCart[i].qty<=0) STATE.kasirCart.splice(i,1);
    document.getElementById('modal-root').innerHTML = pageCartSheet();
    return;
  }
  if(action === 'cart-checkout'){
    const total = STATE.kasirCart.reduce((s,c)=>s+c.price*c.qty,0);
    STATE.kasirCart = [];
    closeModal();
    showToast(`Transaksi warung sebesar ${money(total)} berhasil dicatat!`);
    render(true);
    return;
  }

  if(action === 'hutang-add'){
    const name = prompt('Nama pelanggan:');
    if(!name) return;
    const amount = Number(prompt('Jumlah (angka saja):') || 0);
    const type = confirm('OK = Piutang (mereka berhutang ke kamu) / Cancel = Hutang (kamu berhutang)') ? 'piutang' : 'hutang';
    STATE.hutang.push({name, amount, type});
    render(true);
    return;
  }

  if(action === 'logout'){
    if(confirm('Yakin mau keluar dari akun?')){ showToast('Berhasil keluar dari akun'); }
    return;
  }
  if(action === 'noop'){ showToast('Fitur ini akan segera hadir'); return; }
});

/* ============================================================
   RENDER
============================================================ */
function render(skipModalClose){
  const app = document.getElementById('app');
  // simpan input yang sedang fokus + posisi cursornya, biar gak ke-reset tiap ketik
  const activeEl = document.activeElement;
  const activeId = (activeEl && app.contains(activeEl) && activeEl.id) ? activeEl.id : null;
  const selStart = activeId && activeEl.selectionStart != null ? activeEl.selectionStart : null;
  const selEnd = activeId && activeEl.selectionEnd != null ? activeEl.selectionEnd : null;
  let html = '';
  switch(STATE.page){
    case 'home': html = pageHome(); break;
    case 'topup': html = pageTopup(); break;
    case 'riwayat': html = pageRiwayat(); break;
    case 'pulsa': html = pagePulsa(); break;
    case 'tokenpln': html = pageTokenPln(); break;
    case 'ewallet': html = pageEwallet(); break;
    case 'vouchergame': html = pageVoucherGame(); break;
    case 'generic': html = pageGeneric(); break;
    case 'kasirwarung': html = pageKasirWarung(); break;
    case 'catatanhutang': html = pageCatatanHutang(); break;
    case 'message': html = pageMessage(); break;
    case 'profile': html = pageProfile(); break;
    default: html = pageHome();
  }
  app.innerHTML = html;

  // handle special param init for nav-with-param pages
  if(STATE.page === 'pulsa' && STATE.params && STATE.params.param === 'data' && !STATE.params.tab){
    STATE.params.tab = 'data';
  }
  if(STATE.page === 'ewallet' && typeof STATE.params === 'string'){
    STATE.params = { kind: STATE.params };
  }
  if(STATE.page === 'tokenpln' && typeof STATE.params === 'string'){
    STATE.params = { mode: STATE.params };
  }
  if(STATE.page === 'generic' && typeof STATE.params !== 'string'){
    STATE.params = STATE.params.param || 'Layanan';
  }

  // kembalikan fokus + posisi cursor ke input yang tadi sedang diketik
  if(activeId){
    const restored = document.getElementById(activeId);
    if(restored){
      restored.focus();
      if(selStart != null && restored.setSelectionRange){
        try { restored.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }

  // update bottom nav active state
  document.querySelectorAll('[data-navbtn]').forEach(btn => {
    const isActive = btn.dataset.navbtn === STATE.page || (STATE.page==='home' && btn.dataset.navbtn==='home');
    btn.classList.toggle('text-brand-dark', isActive);
    btn.classList.toggle('text-gray-400', !isActive);
  });

  // autoplay banner cuma jalan di Home; halaman lain hentikan biar gak nyangkut di background
  if(STATE.page === 'home'){
    startBannerAutoplay();
  } else if(bannerTimer){
    clearInterval(bannerTimer);
    bannerTimer = null;
  }
}

// normalize params shape right after nav param passed (string vs object) before first render call chain
const _origNavigate = navigate;
navigate = function(page, param){
  STATE.page = page;
  if(page === 'ewallet') STATE.params = { kind: param };
  else if(page === 'tokenpln') STATE.params = { mode: param };
  else if(page === 'generic') STATE.params = param || 'Layanan';
  else if(page === 'pulsa') STATE.params = { tab0: param };
  else STATE.params = {};
  render();
  window.scrollTo(0,0);
};

// initial render
render();

// Sinkron pertama kali saat app dibuka, lalu polling otomatis tiap 60 detik
// biar produk baru dari Web Admin muncul tanpa perlu reload manual.
syncCatalog();
setInterval(syncCatalog, 60000);
</script>
